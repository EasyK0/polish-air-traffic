name: Release

# Publishes a GitHub release (and its tag) for the newest version in CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create release for the newest changelog version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 -oP '^## \[\K[0-9][^\]]*' CHANGELOG.md || true)
          if [ -z "$ver" ]; then echo "No version in CHANGELOG.md"; exit 0; fi
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          awk -v v="$ver" '/^## /{ if (f) exit; if (index($0, "[" v "]")) { f=1; next } } f' CHANGELOG.md > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
