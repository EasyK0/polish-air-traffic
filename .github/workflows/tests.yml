name: Tests

# Unit tests for the exporter (no network, no API keys).
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: for f in export.mjs lib/*.mjs sources/*.mjs tools/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: node --test tests/*.test.mjs
